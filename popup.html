<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snippet Organizer</title>
    <!-- FAVICON-PACK-01: canonical favicon assets from public/icons/ (supplied
          icon pack). See docs/project-knowledge/ARCHITECTURE.md — do not
          regenerate or substitute this artwork. -->
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
    <style>
      /* Fixed application viewport for BOTH modes (docked action popup and floating
         window): 480 x 600 px (UI-WINDOW-LOCK-01/02/03). No responsive sizing; the
         window size is enforced by the service worker, not by CSS. */
      html,
      body {
        width: 480px;
        height: 600px;
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      if (typeof window !== 'undefined' && new URLSearchParams(window.location.search).get('mode') === 'floating') {
        document.documentElement.classList.add('floating');
        document.body?.classList.add('floating');
      }
    </script>
  </head>
  <body class="m-0 p-0 bg-transparent overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/popup.tsx"></script>
  </body>
</html>
